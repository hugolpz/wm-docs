# Build the app and publish it to https://wm-docs.toolforge.org
#
# One-time setup
#  1. Toolforge: create the tool `wm-docs`, then start its web service:
#       become wm-docs
#       toolforge webservice php8.2 start      # serves ~/public_html
#  2. Toolforge: authorize a dedicated deploy key (ssh-keygen -t ed25519 -f deploy_key) in your
#     Toolforge account, so `ssh <user>@login.toolforge.org` works with it.
#  3. GitHub repo secrets:
#       TOOLFORGE_USER      your Toolforge shell username
#       TOOLFORGE_SSH_KEY   the private deploy key
name: Deploy to Toolforge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  TOOL: wm-docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H login.toolforge.org >> ~/.ssh/known_hosts
      - name: Publish to ~/public_html
        env:
          TOOLFORGE_USER: ${{ secrets.TOOLFORGE_USER }}
        run: |
          # --delete drops files of previous builds; the tool's home is /data/project/$TOOL
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" dist/ \
            "$TOOLFORGE_USER@login.toolforge.org:/data/project/$TOOL/public_html/"
